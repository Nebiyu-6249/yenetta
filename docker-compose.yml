services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: yenetta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yenetta
      POSTGRES_PASSWORD: yenetta
      POSTGRES_DB: yenetta
    ports:
      - '5432:5432'
    volumes:
      - yenetta-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yenetta -d yenetta']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: yenetta-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - yenetta-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yenetta-postgres-data:
  yenetta-redis-data:
