version: 2

# Automated dependency updates (SCA remediation engine). Dependabot opens PRs
# to bump vulnerable/outdated dependencies; the CI security-scan job is the gate
# that keeps new criticals out. Grouped to keep PR volume manageable.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
