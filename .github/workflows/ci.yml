name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-test:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build --filter=@yenetta/shared

      - name: No-emoji rule
        run: pnpm check:emoji

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  security-scan:
    name: Security scan (secrets + dependencies)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the secret scan covers every commit, not just HEAD.
          fetch-depth: 0

      # Hard gate: no committed secrets anywhere in the tree or history.
      # (For an organization-owned repo, set a free GITLEAKS_LICENSE secret.)
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hard gate: no CRITICAL advisory in a shipped (production) dependency.
      # Dev-tooling advisories are tracked below and remediated via Dependabot.
      - name: Dependency audit (fail on production critical)
        run: pnpm audit --prod --audit-level=critical

      # Visibility: print the full high-and-above advisory backlog without
      # blocking. Dependabot opens the PRs that burn this down over time.
      - name: Dependency advisory report (non-blocking)
        run: pnpm audit --audit-level=high || true
